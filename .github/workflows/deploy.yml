name: Deploy Bella Verde Cafe

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build website
        run: bun run build

      - name: Inspect build output
        run: |
          echo "=== Root ==="
          ls -la
          echo "=== dist ==="
          ls -la dist || true
          echo "=== dist/client ==="
          ls -la dist/client || true
          echo "=== .output/public ==="
          ls -la .output/public || true
          echo "=== index.html files ==="
          find . -path './node_modules' -prune -o -name index.html -type f -print | head -50

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
